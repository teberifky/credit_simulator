name: Java CI

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
    branches: [master, main]

jobs:
  test:
    name: Build, Test, and Smoke Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Make launcher executable
        run: chmod +x ./credit_simulator

      - name: Build and run tests
        run: mvn -B clean verify

      - name: Smoke test launcher
        run: ./credit_simulator file_inputs.txt < /dev/null
